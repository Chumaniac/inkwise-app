[project]
name = "inkwise-k12"
version = "0.7.0"
description = "Teacher-reviewed K12 writing assessment architecture and reference core"
requires-python = ">=3.12"
dependencies = [
  "langgraph>=1.0,<2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.6,<3",
  "python-multipart>=0.0.20,<1",
  "pillow>=11,<13",
  "numpy>=2,<3",
]

[project.optional-dependencies]
routing = ["tokenizers>=0.21,<1"]
language = ["lingua-language-detector>=2.1,<3"]
ocr = ["torch>=2.6,<3", "torchvision>=0.21,<1", "transformers>=4.49,<5", "safetensors>=0.5,<1"]
postgres = ["psycopg[binary]>=3.2,<4"]
retrieval = ["neo4j>=5.26,<7", "sqlite-vec>=0.1,<1", "apsw>=3.45,<4"]
kafka = ["aiokafka>=0.12,<1"]
data = ["dvc>=3,<4"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[project.scripts]
inkwise = "inkwise.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inkwise"]
